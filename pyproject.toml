[project]
name = "lakehouse-insights-skill"
version = "0.1.0"
description = "Metrics catalog → proposed SQL; optional DuckDB/CSV sandbox with --execute"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
duckdb = ["duckdb>=1.0"]

[project.scripts]
lakehouse-insights = "lakehouse_insights.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
