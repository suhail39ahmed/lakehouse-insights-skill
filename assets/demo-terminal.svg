<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="214" viewBox="0 0 900 214">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient></defs>
  <rect width="900" height="214" rx="12" fill="url(#bg)"/>
  <rect x="0" y="0" width="900" height="34" rx="12" fill="#1e293b"/><rect x="0" y="22" width="900" height="12" fill="#1e293b"/>
  <circle cx="20" cy="16" r="5" fill="#f87171"/><circle cx="38" cy="16" r="5" fill="#fbbf24"/><circle cx="56" cy="16" r="5" fill="#4ade80"/>
  <text x="450" y="20" text-anchor="middle" fill="#cbd5e1" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">lakehouse-insights-skill · offline fixtures · make demo</text>
  <text x="18" y="52" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">$ python -m lakehouse_insights &quot;revenue by region&quot;</text>
  <text x="18" y="70" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400">propose → SQL from metrics catalog (no execute)</text>
  <text x="18" y="88" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400">SELECT region, SUM(revenue_usd) AS revenue_usd, SUM(orders) AS orders FROM daily_revenue GROUP BY re</text>
  <text x="18" y="124" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600">$ python -m lakehouse_insights &quot;which pipelines failed&quot; --execute</text>
  <text x="18" y="142" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400">sandbox execute · explicit --execute flag only</text>
  <text x="18" y="160" fill="#86efac" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="400">✓ lakehouse-insights-skill demo OK</text>
</svg>
